name: Publish image

on:
  workflow_dispatch:        # ← this is the only trigger you need
    inputs:
    tag:
      description: 'v0.2.1'
      required: true
      default: 'latest'

permissions:
  contents: read
  packages: write           # required to push to GHCR

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ inputs.tag }}
