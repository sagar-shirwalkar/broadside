name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check proto freshness
        run: pnpm task proto:check

      - name: Type-check
        run: pnpm task lint

      - name: Test
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Install UI deps
        run: pnpm --dir ui install --frozen-lockfile

      - name: Build UI
        run: pnpm task build:ui

      - name: Test UI (unit)
        run: pnpm --dir ui test

  ui-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install UI deps
        run: pnpm --dir ui install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --dir ui exec playwright install --with-deps chromium

      - name: Test UI (e2e)
        run: pnpm --dir ui test:e2e

  docker:
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t artilleryviz:ci .
